name: Build iOS IPA (Sideload)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project SideloadHub.xcodeproj \
            -scheme SideloadHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            VALIDATE_PRODUCT=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Show Swift errors
        if: failure()
        run: grep -E "error:|fatal error:" xcodebuild.log || tail -n 80 xcodebuild.log
      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "SideloadHub.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload && cp -r "$APP_PATH" Payload/
          zip -r SideloadHub.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v5
        with:
          name: SideloadHub-ipa
          path: SideloadHub.ipa
          retention-days: 30
